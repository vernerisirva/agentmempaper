name: Paper Scout

# Recurring scientific assessment was enabled on 2026-09-19, after every gate was met:
#
#   PRIVATE_DURABLE_STATE_READY         YES   private state repo + token, round-trip verified
#   GITHUB_GEMINI_SECRET                PRESENT
#   GITHUB_OPENROUTER_SECRET            PRESENT
#   OPERATIONAL_RETRY_ELIGIBILITY_READY YES
#   DAILY_COST_GUARD_READY              YES
#   FULL_VALIDATION                     PASS   606 tests
#   INDEPENDENT_REVIEW                  PASS_WITH_NOTES, 0 unresolved blockers
#   FIRST_OPERATIONAL_SMOKE             PASS   run 35461618434, 2 assessed, 2 promoted
#
# Bounds are frozen and must not be raised without an explicit operational decision:
# 1 paper per track per run, 4 per run, $0.30 known OpenRouter spend per run. The run
# ceiling went from 3 to 4 on 2026-09-21 only because a fourth track (computer_vision) was
# added; the per-track quota is unchanged and no track may ever assess more than one paper
# per run. The cost ceiling was NOT raised: four bounded adjudications cost 4 x $0.0298 =
# $0.119 at the measured rate, or $0.20 at the conservative per-paper estimate, both under
# $0.30. A track with nothing eligible forfeits its slot rather than lending it, so the
# usual daily maximum stays below the ceiling. This workflow and the weekly backfill share
# one concurrency group with cancel-in-progress false and queue max, which is what keeps a
# single writer on the durable state.
on:
  schedule:
    # 04:00 UTC is 06:00 in Europe/Helsinki (UTC+2), weekdays only.
    #
    # GitHub runs cron on a best-effort queue and has never started this repository's
    # scheduled run near its nominal time: with a 06:20 UTC cron, observed starts across
    # nine runs ranged from 10:50 to 12:52 UTC, a consistent four-to-six hour delay. An
    # earlier cron moves the queue position earlier but cannot promise an arrival time.
    # If the run must land by a given hour, trigger it on a self-hosted schedule and use
    # workflow_dispatch, because this trigger cannot guarantee it.
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Deploy the reviewed committed site without discovery or assessment"
        type: boolean
        default: false
      run_assessment:
        description: "Run the bounded scientific-assessment stage (scheduled runs always do)"
        type: boolean
        default: false
      allow_state_initialize:
        description: "FIRST RUN ONLY: create empty state when no private snapshot exists"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-scout-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      # The `inputs` context exists only for workflow_dispatch; on a schedule trigger it
      # is null, so gating the scientific steps on `inputs.run_assessment` alone silently
      # skipped them on exactly the runs the schedule exists for. A scheduled run assesses
      # by default; a manual run still has to ask for it.
      RUN_ASSESSMENT: ${{ github.event_name == 'schedule' || inputs.run_assessment }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # 1. Restore private state, and verify it before anything reads it. Fails closed:
      #    a missing, unreachable, corrupt or partial snapshot stops the run rather than
      #    silently continuing on empty state.
      - name: Restore private Paper Scout state
        id: restore-state
        if: ${{ !inputs.deploy_only }}
        env:
          # Scoped to this step only. A fine-grained PAT in a workflow- or job-level env
          # block is handed to every step, including third-party actions, which is a far
          # wider blast radius than the transport needs.
          PAPER_SCOUT_STATE_REPO: ${{ vars.PAPER_SCOUT_STATE_REPO }}
          PAPER_SCOUT_STATE_TOKEN: ${{ secrets.PAPER_SCOUT_STATE_TOKEN }}
        run: |
          python .github/scripts/paper_scout_state.py restore \
            ${{ inputs.allow_state_initialize && '--allow-initialize' || '' }} \
            --report "${RUNNER_TEMP}/state-restore.json"

      - name: Verify restored state integrity
        if: ${{ !inputs.deploy_only }}
        run: python .github/scripts/check_stored_assessments.py

      - name: Validate rules, idempotency, and live source payloads
        if: ${{ !inputs.deploy_only }}
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "*.py" | tee paper-scout-tests.log
          python -m paper_scout evaluate-relevance --track agent_memory | tee relevance-eval-agent-memory.log
          python -m paper_scout evaluate-relevance --track deep_research | tee relevance-eval-deep-research.log
          python -m paper_scout evaluate-relevance --track engram | tee relevance-eval-engram.log
          python -m paper_scout evaluate-relevance --track computer_vision | tee relevance-eval-computer-vision.log
          python -m paper_scout evaluate-quality --track agent_memory | tee quality-eval-agent-memory.log
          python -m paper_scout evaluate-quality --track deep_research | tee quality-eval-deep-research.log
          python -m paper_scout evaluate-quality --track engram | tee quality-eval-engram.log
          python -m paper_scout evaluate-quality --track computer_vision | tee quality-eval-computer-vision.log
          python -m paper_scout evaluate-discovery --track agent_memory | tee discovery-eval-agent-memory.log
          python -m paper_scout evaluate-discovery --track deep_research | tee discovery-eval-deep-research.log
          python -m paper_scout evaluate-discovery --track engram | tee discovery-eval-engram.log
          python -m paper_scout evaluate-discovery --track computer_vision | tee discovery-eval-computer-vision.log
          python -m paper_scout validate-idempotency --track agent_memory | tee idempotency-agent-memory.log
          python -m paper_scout validate-idempotency --track deep_research | tee idempotency-deep-research.log
          python -m paper_scout validate-idempotency --track engram | tee idempotency-engram.log
          python -m paper_scout validate-idempotency --track computer_vision | tee idempotency-computer-vision.log
          PAPER_SCOUT_STATE_PATH=${{ runner.temp }}/paper_scout_agent_memory_smoke.sqlite3 python -m paper_scout smoke-live --track agent_memory --days 14 --max-results-per-source 25 --no-notify --ci | tee live-smoke-agent-memory.log
          PAPER_SCOUT_STATE_PATH=${{ runner.temp }}/paper_scout_deep_research_smoke.sqlite3 python -m paper_scout smoke-live --track deep_research --days 14 --max-results-per-source 25 --no-notify --ci | tee live-smoke-deep-research.log
          # Engram and computer vision have no live-smoke step, by the same reasoning: the
          # two smokes above already exercise every provider this repository talks to, and
          # each additional one costs 26 more logical search slots against shared provider
          # throttling for no new signal. A provider regression that would break the new
          # tracks breaks these two first, in the same run, before the assessment stage.

      # 2. Discovery and metadata only. --no-llm keeps the scientific gate out of this
      #    step entirely, so a discovery run can never write an assessment row.
      - name: Run discovery and metadata update
        if: ${{ !inputs.deploy_only }}
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          PAPER_SCOUT_WEBHOOK_URL: ${{ secrets.PAPER_SCOUT_WEBHOOK_URL }}
        run: |
          set -o pipefail
          python -m paper_scout run --track agent_memory --no-llm | tee paper-scout-run-agent-memory.log
          python -m paper_scout run --track deep_research --no-llm | tee paper-scout-run-deep-research.log
          # Missing seed records only; repeat runs perform no direct-ID requests.
          #
          # --allow-unresolved because a seed can fail for reasons this repository does not
          # control: a provider outage, or third-party metadata that resolves the right
          # identifier to the wrong paper, which the identity check then correctly refuses.
          # Without it the bootstrap's exit code aborts this step under `set -e`, and the
          # run loses assessment, the site build and the state persist for every track --
          # which is exactly what happened on run 35594457409. The failure is still reported
          # as an error annotation, and the next run retries it.
          python -m paper_scout ingest-seeds --track engram --allow-unresolved | tee paper-scout-seeds-engram.log
          python -m paper_scout run --track engram --no-llm | tee paper-scout-run-engram.log
          python -m paper_scout ingest-seeds --track computer_vision --allow-unresolved | tee paper-scout-seeds-computer-vision.log
          python -m paper_scout run --track computer_vision --no-llm | tee paper-scout-run-computer-vision.log

      # 3. Credential preflight. Reports presence by variable name only and never a
      #    value. It gates the assessment stage rather than failing the job: a failed job
      #    would skip the persist step below, so a missing secret would cost a whole day
      #    of discovery as well as the assessment. The run is still marked loudly with an
      #    error annotation, and no assessment row is written either way.
      - name: Scientific credential preflight
        id: preflight
        if: ${{ !inputs.deploy_only && env.RUN_ASSESSMENT == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from paper_scout.operational_preflight import credential_preflight
          result = credential_preflight()
          detail = json.dumps(result.to_dict(), indent=2)
          print(f"ok={'true' if result.ok else 'false'}")
          # GITHUB_OUTPUT is line-oriented: a newline in the value corrupts the file and
          # silently breaks every later output, so collapse whitespace and bound length.
          reason = " ".join(str(result.reason).split())[:200]
          print(f"reason={reason}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Credential preflight\n\n```json\n{detail}\n```\n")
          if not result.ok:
              # Loud, but not fatal: the assessment stage is skipped and durable state is
              # still snapshotted and persisted at the end of the run.
              print(f"::error::Scientific assessment stage skipped: {result.reason}."
                    " No assessment was attempted and no candidate eligibility was consumed.",
                    file=__import__("sys").stderr)
          PY

      # 4. The bounded scientific-assessment stage: at most one paper per track and four
      #    per run, under the unchanged per-run OpenRouter ceiling. A track with nothing
      #    eligible forfeits its slot rather than lending it, so the usual daily maximum
      #    stays below the ceiling.
      - name: Bounded scientific assessment
        id: assess
        if: ${{ !inputs.deploy_only && env.RUN_ASSESSMENT == 'true' && steps.preflight.outputs.ok == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAPER_SCOUT_OPENROUTER_RUN_CEILING_USD: "0.30"
        run: |
          set -o pipefail
          python -m paper_scout operational-assess \
            --metrics reports/paper_scout/operational-metrics-$(date -u +%F).json \
            | tee operational-assess.log

      - name: Build public site
        if: ${{ !inputs.deploy_only }}
        run: |
          set -o pipefail
          python -m paper_scout build-site --track agent_memory | tee paper-scout-build-site-agent-memory.log
          python -m paper_scout build-site --track deep_research | tee paper-scout-build-site-deep-research.log
          python -m paper_scout build-site --track engram | tee paper-scout-build-site-engram.log
          python -m paper_scout build-site --track computer_vision | tee paper-scout-build-site-computer-vision.log

      - name: Validate generated schemas, links, and runtime exclusion
        run: python .github/scripts/check_paper_scout_site.py

      # A published site or report must never carry state. This is the last line of
      # defence before anything becomes public.
      - name: Refuse to publish private state
        run: |
          if find docs reports/paper_scout digests -type f \
               \( -name '*.sqlite3' -o -name '*.sqlite3-*' -o -name '*.tar.gz' \) | grep .; then
            echo "::error::Refusing to publish Paper Scout runtime state or snapshots."
            exit 1
          fi
          # A documented example such as "GEMINI_API_KEY: <redacted>" is not a leak, so
          # obvious placeholders are excluded before a match is treated as one.
          if grep -rhoE '(GEMINI_API_KEY|OPENROUTER_API_KEY|PAPER_SCOUT_STATE_TOKEN)[=:][[:space:]]*[A-Za-z0-9_-]{8,}' docs reports/paper_scout 2>/dev/null \
               | grep -vEi '(your|example|redact|placeholder|xxx|changeme|dummy|synthetic|secrets\.|vars\.|AVAILABLE|MISSING|PRESENT|UNKNOWN)' \
               | grep .; then
            echo "::error::Refusing to publish a credential-shaped value."
            exit 1
          fi
          echo "No private state, snapshot or credential-shaped value in published output."

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Paper Scout"
            echo
            echo "### Operational metrics"
            echo '```json'
            cat reports/paper_scout/operational-metrics-*.json 2>/dev/null || echo '{"note":"assessment stage did not run"}'
            echo '```'
            echo
            echo "### Command output"
            echo '```text'
            cat ./*.log 2>/dev/null || true
            echo '```'
            echo
            echo "### Generated files"
            find digests reports docs -type f 2>/dev/null | sort || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-scout-reports
          path: |
            reports/paper_scout/
            docs/
            *.log
          if-no-files-found: ignore

      - name: Commit scout updates
        id: commit-scout-updates
        if: ${{ success() && !inputs.deploy_only }}
        run: |
          python .github/scripts/check_generated_file_sizes.py digests docs reports/paper_scout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- digests docs reports/paper_scout
          if git diff --cached --name-only | grep -E '(^|/).*\.sqlite3(-journal|-wal|-shm)?$'; then
            echo "::error::Refusing to commit Paper Scout runtime state. Only generated digests, site files, and reports may be staged."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No paper scout changes to commit."
          else
            git commit -m "chore: update paper scout digest"
            git push
          fi

      # 5. Snapshot, verify, then persist privately. Ordered before Pages so state is
      #    never left behind a deployment, and skipped entirely if anything above failed.
      - name: Prepare consistent Paper Scout state snapshot
        if: ${{ success() && !inputs.deploy_only }}
        run: python .github/scripts/prepare_paper_scout_state.py data/paper_scout.sqlite3 data/deep_research/paper_scout.sqlite3 data/engram/paper_scout.sqlite3 data/computer_vision/paper_scout.sqlite3

      - name: Persist private Paper Scout state
        id: persist-state
        if: ${{ success() && !inputs.deploy_only }}
        env:
          # Scoped to this step only. A fine-grained PAT in a workflow- or job-level env
          # block is handed to every step, including third-party actions, which is a far
          # wider blast radius than the transport needs.
          PAPER_SCOUT_STATE_REPO: ${{ vars.PAPER_SCOUT_STATE_REPO }}
          PAPER_SCOUT_STATE_TOKEN: ${{ secrets.PAPER_SCOUT_STATE_TOKEN }}
        run: |
          python .github/scripts/paper_scout_state.py persist \
            --report "${RUNNER_TEMP}/state-persist.json"

      - name: Configure GitHub Pages
        if: success()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record state hashes in the run summary
        if: always()
        run: |
          {
            echo "### Durable state"
            echo '```json'
            # Test for the file rather than relying on a pipeline exit status: head exits
            # 0 even when cat fails, so a || fallback after the pipe never runs and the
            # summary would silently omit that a stage was skipped.
            if [ -f "${RUNNER_TEMP}/state-restore.json" ]; then
              head -c 4000 "${RUNNER_TEMP}/state-restore.json"
            else
              echo '{"restore":"did not run"}'
            fi
            if [ -f "${RUNNER_TEMP}/state-persist.json" ]; then
              head -c 4000 "${RUNNER_TEMP}/state-persist.json"
            else
              echo '{"persist":"did not run"}'
            fi
            echo '```'
            echo "Pages deployment: ${{ steps.deployment.outcome || 'not attempted' }}"
          } >> "$GITHUB_STEP_SUMMARY"
