name: Paper Scout checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline tests and all-track builds
        run: |
          python -m unittest discover -s tests -p '*.py'
          for track in agent_memory deep_research engram; do
            python -m paper_scout evaluate-relevance --track "$track"
            python -m paper_scout evaluate-quality --track "$track"
            python -m paper_scout evaluate-discovery --track "$track"
            python -m paper_scout validate-idempotency --track "$track"
            python -m paper_scout build-site --track "$track" --offline
          done
          python .github/scripts/check_paper_scout_site.py
          python .github/scripts/check_generated_file_sizes.py digests docs reports/paper_scout
          git diff --check
