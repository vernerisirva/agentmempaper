name: Paper Scout Backfill

on:
  schedule:
    - cron: "40 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-scout-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The immediate parent is the normal one-time migration seed.
          fetch-depth: 2

      - name: Restore durable Paper Scout state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/download-paper-scout-state.sh

      - name: Bootstrap Paper Scout state when no durable snapshot exists
        env:
          PAPER_SCOUT_STATE_SEED_REF: 026158c36d109669e16b1c008b69d1031a2a357b
        run: bash .github/scripts/restore-paper-scout-state.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate discovery plan
        run: python -m paper_scout evaluate-discovery --track agent_memory | tee discovery-eval-agent-memory.log

      - name: Run 45-day Agentic Memory backfill
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          set -o pipefail
          python -m paper_scout backfill --track agent_memory --days 45 --no-notify | tee paper-scout-backfill-agent-memory.log
          python -m paper_scout build-site --track agent_memory | tee paper-scout-build-site-agent-memory.log

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Paper Scout weekly backfill"
            echo
            echo '```text'
            cat discovery-eval-agent-memory.log paper-scout-backfill-agent-memory.log paper-scout-build-site-agent-memory.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-scout-backfill-reports
          path: |
            reports/paper_scout/
            *.log
          if-no-files-found: ignore

      - name: Commit backfill updates
        id: commit-backfill-updates
        if: success()
        run: |
          python .github/scripts/check_generated_file_sizes.py digests docs reports/paper_scout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- digests docs reports/paper_scout
          if git diff --cached --name-only | grep -E '(^|/).*\.sqlite3(-journal|-wal|-shm)?$'; then
            echo "::error::Refusing to commit Paper Scout runtime state. Only generated digests, site files, and reports may be staged."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No paper scout backfill changes to commit."
          else
            git commit -m "chore: update paper scout backfill"
            git push
          fi

      - name: Prepare consistent Paper Scout state snapshot
        if: ${{ steps.commit-backfill-updates.outcome == 'success' }}
        run: python .github/scripts/prepare_paper_scout_state.py data/paper_scout.sqlite3 data/deep_research/paper_scout.sqlite3

      - name: Persist durable Paper Scout state
        id: persist-backfill-state
        if: ${{ steps.commit-backfill-updates.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/upload-paper-scout-state.sh
