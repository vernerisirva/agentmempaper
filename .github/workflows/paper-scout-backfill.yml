name: Paper Scout Backfill

# Re-enabled on 2026-09-19 alongside the daily workflow. This one performs recovery only
# and never runs the scientific gate: every backfill command passes --no-llm and the step
# receives no scientific credential. It uses the same private durable state through the
# same transport, with the token scoped to the two transport steps, and shares the daily
# workflow's concurrency group so the two serialize and a single writer owns the state.
on:
  schedule:
    - cron: "40 5 * * 0"
  workflow_dispatch:
    inputs:
      allow_state_initialize:
        description: "FIRST RUN ONLY: create empty state when no private snapshot exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-scout-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Restore private Paper Scout state
        env:
          # Scoped to this step only. A fine-grained PAT in a workflow- or job-level env
          # block is handed to every step, including third-party actions, which is a far
          # wider blast radius than the transport needs.
          PAPER_SCOUT_STATE_REPO: ${{ vars.PAPER_SCOUT_STATE_REPO }}
          PAPER_SCOUT_STATE_TOKEN: ${{ secrets.PAPER_SCOUT_STATE_TOKEN }}
        run: |
          python .github/scripts/paper_scout_state.py restore \
            ${{ inputs.allow_state_initialize && '--allow-initialize' || '' }} \
            --report "${RUNNER_TEMP}/state-restore.json"

      - name: Validate discovery plan
        run: |
          set -o pipefail
          python -m paper_scout evaluate-discovery --track agent_memory | tee discovery-eval-agent-memory.log
          python -m paper_scout evaluate-discovery --track engram | tee discovery-eval-engram.log

      - name: Run bounded 45-day backfill
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          set -o pipefail
          python -m paper_scout backfill --track agent_memory --days 45 --no-notify --no-llm | tee paper-scout-backfill-agent-memory.log
          python -m paper_scout build-site --track agent_memory | tee paper-scout-build-site-agent-memory.log
          python -m paper_scout ingest-seeds --track engram | tee paper-scout-seeds-engram.log
          python -m paper_scout backfill --track engram --days 45 --no-notify --no-llm | tee paper-scout-backfill-engram.log
          python -m paper_scout build-site --track engram | tee paper-scout-build-site-engram.log

      - name: Validate generated schemas, links, and runtime exclusion
        run: python .github/scripts/check_paper_scout_site.py

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Paper Scout weekly backfill"
            echo
            echo '```text'
            cat discovery-eval-agent-memory.log paper-scout-backfill-agent-memory.log paper-scout-build-site-agent-memory.log *engram.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-scout-backfill-reports
          path: |
            reports/paper_scout/
            *.log
          if-no-files-found: ignore

      - name: Commit backfill updates
        id: commit-backfill-updates
        if: success()
        run: |
          python .github/scripts/check_generated_file_sizes.py digests docs reports/paper_scout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- digests docs reports/paper_scout
          if git diff --cached --name-only | grep -E '(^|/).*\.sqlite3(-journal|-wal|-shm)?$'; then
            echo "::error::Refusing to commit Paper Scout runtime state. Only generated digests, site files, and reports may be staged."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No paper scout backfill changes to commit."
          else
            git commit -m "chore: update paper scout backfill"
            git push
          fi

      - name: Prepare consistent Paper Scout state snapshot
        if: ${{ steps.commit-backfill-updates.outcome == 'success' }}
        run: python .github/scripts/prepare_paper_scout_state.py data/paper_scout.sqlite3 data/deep_research/paper_scout.sqlite3 data/engram/paper_scout.sqlite3

      - name: Persist private Paper Scout state
        id: persist-backfill-state
        if: ${{ steps.commit-backfill-updates.outcome == 'success' }}
        env:
          # Scoped to this step only. A fine-grained PAT in a workflow- or job-level env
          # block is handed to every step, including third-party actions, which is a far
          # wider blast radius than the transport needs.
          PAPER_SCOUT_STATE_REPO: ${{ vars.PAPER_SCOUT_STATE_REPO }}
          PAPER_SCOUT_STATE_TOKEN: ${{ secrets.PAPER_SCOUT_STATE_TOKEN }}
        run: python .github/scripts/paper_scout_state.py persist --report "${RUNNER_TEMP}/state-persist.json"
